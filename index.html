<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKAY Clan App</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #1a1a24;
            border: 1px solid #2b2b3d;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #4e73df;
            margin-bottom: 10px;
        }
        p {
            color: #a0a0b8;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background: #4e73df;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #375a7f;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>SKAY CLAN</h1>
        <p>Вітаємо у офіційному додатку клану!</p>
        <p>Ця платформа працює як повноцінний PWA-додаток на твоєму пристрої.</p>
        <a href="#" class="btn">Увійти / Меню</a>
    </div>

</body>
</html>
