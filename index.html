<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKAY Clan — Портал</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0d12;
      --card-bg: #121620;
      --inner-card: #181d2a;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-dark: #1e293b;
      --accent-red-dark: #2d191e;
      --accent-red-text: #f87171;
      --accent-gold: #f59e0b;
      --accent-green: #22c55e;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .portal-card {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .avatar-wrap {
      width: 96px; height: 96px; border-radius: 50%;
      background: #0d1017; border: 2px solid var(--accent-blue);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
      margin: 0 auto 12px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .portal-header { text-align: center; margin-bottom: 22px; }
    .portal-header h1 { font-size: 24px; font-weight: 800; }
    .portal-header p { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

    .section-box {
      background: var(--inner-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .section-box h3 {
      font-size: 12px; font-weight: 700; color: var(--accent-blue);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px;
    }

    .bday-box {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px; padding: 12px; margin-bottom: 14px; text-align: center;
    }
    .bday-box h4 { color: var(--accent-gold); font-size: 13px; font-weight: 700; }
    .bday-box p { color: #fff; font-size: 12px; margin-top: 2px; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .info-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 10px; padding: 10px 12px;
    }
    .info-label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; }
    .info-value { font-size: 15px; font-weight: 700; color: #fff; margin-top: 2px; }

    .menu-buttons { display: flex; flex-direction: column; gap: 10px; }
    .btn-main {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s;
    }
    .btn-blue { background: var(--accent-blue); color: #fff; }
    .btn-blue:hover { background: var(--accent-blue-hover); }
    .btn-dark { background: var(--accent-dark); color: #fff; border: 1px solid var(--border-color); }
    .btn-dark:hover { background: #283548; }

    .view-screen { display: none; }
    .view-screen.active { display: block; }

    .back-btn {
      background: transparent; border: none; color: var(--accent-blue);
      font-weight: 600; font-size: 13px; cursor: pointer; margin-bottom: 16px;
    }

    input, select {
      width: 100%; padding: 11px; background: #0d1017;
      border: 1px solid var(--border-color); border-radius: 8px;
      color: #fff; font-size: 13px; outline: none; margin-bottom: 10px;
    }

    .timer-display {
      font-size: 20px; font-weight: 800; color: var(--accent-green);
      text-align: center; margin: 10px 0; background: rgba(34, 197, 94, 0.1);
      padding: 10px; border-radius: 8px; border: 1px dashed var(--accent-green);
    }
  </style>
</head>
<body>

<div class="portal-card">

  <!-- ГОЛОВНЕ МЕНЮ -->
  <div id="home_view" class="view-screen active">
    <div class="avatar-wrap"><img src="icon.png" alt="SKAY"></div>
    <div class="portal-header">
      <h1>SKAY CLAN</h1>
      <p>Офіційний портал клану UKRAINE GTA</p>
    </div>
    <div class="menu-buttons">
      <button class="btn-main btn-blue" onclick="openView('cabinet_auth_view')">🔑 Вхід в кабінет</button>
      <button class="btn-main btn-dark" onclick="openView('admin_auth_view')">👑 Кабінет керівництва</button>
    </div>
  </div>

  <!-- ВХІД В КАБІНЕТ -->
  <div id="cabinet_auth_view" class="view-screen">
    <button class="back-btn" onclick="openView('home_view')">← Назад</button>
    <div class="section-box">
      <h3>🔑 Авторизація учасника</h3>
      <input type="text" id="user_card" placeholder="Введіть 6 цифр картки">
      <button class="btn-main btn-blue" id="login_btn" onclick="loginUser()">Увійти</button>
    </div>
  </div>

  <!-- ОСОБИСТИЙ КАБІНЕТ -->
  <div id="cabinet_view" class="view-screen">
    <button class="back-btn" onclick="openView('home_view')">← Вийти з кабінету</button>
    
    <div class="section-box" style="border-color: rgba(34, 197, 94, 0.4);">
      <h3 style="color: var(--accent-green);">🎉 Успішна авторизація!</h3>
      <p style="font-size: 14px; color: #fff;">Вітаємо в системі, <b id="res_nick">---</b>!</p>
    </div>

    <div id="cab_bday_box" class="bday-box" style="display:none;">
      <h4>🎂 СЬОГОДНІ ДЕНЬ НАРОДЖЕННЯ</h4>
      <p id="cab_bday_text">-</p>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;">
      <button class="btn-main btn-dark" onclick="showCabTab('tab_info')">👤 Моя інформація</button>
      <button class="btn-main btn-dark" onclick="showCabTab('tab_factory')">🏭 Бронювання цеху</button>
    </div>

    <!-- ТАБ: ІНФОРМАЦІЯ -->
    <div id="tab_info" class="section-box cab-tab">
      <h3>👤 ПРОФІЛЬ СОКЛАНІВЦЯ</h3>
      <div class="info-grid">
        <div class="info-card">
          <div class="info-label">Ранг</div>
          <div class="info-value" id="res_rank">-</div>
        </div>
        <div class="info-card">
          <div class="info-label">Загальний Баланс</div>
          <div class="info-value" id="res_balance" style="color: var(--accent-blue);">0 грн</div>
        </div>
        <div class="info-card">
          <div class="info-label">Попередження</div>
          <div class="info-value" id="res_warns" style="color: var(--accent-gold);">0</div>
        </div>
        <div class="info-card">
          <div class="info-label">Догани</div>
          <div class="info-value" id="res_reps" style="color: var(--accent-red-text);">0</div>
        </div>
      </div>
    </div>

    <!-- ТАБ: БРОНЮВАННЯ -->
    <div id="tab_factory" class="section-box cab-tab" style="display:none;">
      <h3>🏭 БРОНЮВАННЯ ЦЕХУ</h3>
      <div id="booking_form_block">
        <select id="factory_type">
          <option>Цех №1 (Петрушка)</option>
          <option>Цех №2 (Алкоголь)</option>
          <option>Цех №3 (Зброя)</option>
        </select>
        <button class="btn-main btn-blue" id="book_btn" onclick="startBooking()">Забронювати на 1 годину</button>
      </div>

      <div id="timer_block" style="display:none;">
        <p style="font-size: 13px; color: var(--text-sub); text-align: center;">Цех успішно заброньовано! Залишилося часу:</p>
        <div class="timer-display" id="timer_count">60:00</div>
      </div>
    </div>

  </div>

</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzeK8R8VQk9JOOsv71qsHZe85chJYhwOW6AKFGIuZwdB_zopb9WexEGTWqGN3Bc2oQ2/exec";
  let countdownInterval = null;

  function openView(viewId) {
    document.querySelectorAll('.view-screen').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

  function showCabTab(tabId) {
    document.querySelectorAll('.cab-tab').forEach(t => t.style.display = 'none');
    document.getElementById(tabId).style.display = 'block';
  }

  async function apiCall(data) {
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      return await response.json();
    } catch (e) {
      return { success: false, message: "Помилка з'єднання." };
    }
  }

  async function loginUser() {
    const card = document.getElementById('user_card').value.trim();
    const btn = document.getElementById('login_btn');
    if(!card) return alert("Введіть номер картки!");

    btn.innerText = "Авторизація...";
    btn.disabled = true;

    const res = await apiCall({ action: "get_member_cabinet", card: card });
    btn.innerText = "Увійти";
    btn.disabled = false;

    if(res.success && res.data) {
      openView('cabinet_view');
      document.getElementById('res_nick').innerText = res.data.nick || "Учасник";
      document.getElementById('res_rank').innerText = res.data.rank || "-";
      document.getElementById('res_warns').innerText = res.data.warnings || "0";
      document.getElementById('res_reps').innerText = res.data.reprimands || "0";
      document.getElementById('res_balance').innerText = (res.data.balance || 0) + " грн";

      // ДН у кабінеті
      if(res.birthdays && res.birthdays.length > 0) {
        document.getElementById('cab_bday_text').innerText = res.birthdays.join(", ");
        document.getElementById('cab_bday_box').style.display = "block";
      }
    } else {
      alert(res.message || "Помилка авторизації!");
    }
  }

  async function startBooking() {
    const factory = document.getElementById('factory_type').value;
    const nick = document.getElementById('res_nick').innerText;
    const btn = document.getElementById('book_btn');

    btn.disabled = true;
    btn.innerText = "Запис...";

    const res = await apiCall({ action: "book_factory", nick: nick, factory: factory });
    
    btn.disabled = false;
    btn.innerText = "Забронювати на 1 годину";

    if(res.success) {
      document.getElementById('booking_form_block').style.display = 'none';
      document.getElementById('timer_block').style.display = 'block';
      runTimer(3600); // 1 година в секундах
    } else {
      alert(res.message || "Помилка бронювання!");
    }
  }

  function runTimer(seconds) {
    clearInterval(countdownInterval);
    let timeLeft = seconds;

    countdownInterval = setInterval(() => {
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      document.getElementById('timer_count').innerText = 
        `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

      if (timeLeft <= 0) {
        clearInterval(countdownInterval);
        document.getElementById('timer_block').style.display = 'none';
        document.getElementById('booking_form_block').style.display = 'block';
        alert("Час бронювання цеху вичерпано!");
      }
      timeLeft--;
    }, 1000);
  }
</script>

</body>
</html>
