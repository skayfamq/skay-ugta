<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKAY Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090c10;
      --panel-bg: rgba(15, 20, 29, 0.85);
      --card-bg: #131924;
      --input-bg: #1a2231;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #0088ff;
      --accent-glow: rgba(0, 136, 255, 0.35);
      --green: #10b981;
      --red: #ef4444;
      --text: #f3f4f6;
      --text-dim: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 136, 255, 0.15) 0%, transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(9,12,16,1) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    /* Верхній Header */
    .app-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent), #0044ff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.04);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }

    /* Головне Меню */
    .nav-bar {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .nav-btn {
      padding: 14px 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-dim);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .nav-btn:hover {
      border-color: rgba(0, 136, 255, 0.4);
      color: #fff;
      transform: translateY(-2px);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, rgba(0,136,255,0.2) 0%, rgba(0,136,255,0.05) 100%);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Основний Панельний Контейнер */
    .main-panel {
      width: 100%;
      max-width: 900px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .tab { display: none; }
    .tab.active { display: block; animation: tabFade 0.3s ease; }

    @keyframes tabFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    /* Форми та Спланована Сітка */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .full { grid-column: span 2; }
    .full-3 { grid-column: span 3; }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Кнопки Дій */
    .btn-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-accent:hover { background: #0077e6; transform: translateY(-1px); }

    .btn-green {
      background: var(--green);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-green:hover { background: #0d9668; transform: translateY(-1px); }

    .btn-red {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    .btn-red:hover { background: #dc2626; transform: translateY(-1px); }

    /* Картки Інформації в Кабінеті */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
    .stat-card .value { font-size: 18px; font-weight: 700; color: #fff; }

    @media (max-width: 768px) {
      .form-grid, .grid-3, .stats-container { grid-template-columns: 1fr; }
      .full, .full-3 { grid-column: span 1; }
      .nav-bar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">S</div>
      <div class="brand-title">SKAY CONTROL</div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span> Система активна
    </div>
  </header>

  <!-- Навігація -->
  <nav class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('apply', event)">📝 Заявка</button>
    <button class="nav-btn" onclick="switchTab('cabinet', event)">🔑 Кабінет</button>
    <button class="nav-btn" onclick="switchTab('admin', event)">💼 Керівництво</button>
  </nav>

  <!-- Основна панель -->
  <main class="main-panel">

    <!-- Вкладка 1: Подача заявки -->
    <div id="apply" class="tab active">
      <div class="section-title">📝 Подати заявку на вступ</div>
      <div class="form-grid">
        <div class="input-group">
          <label>Ігровий Нікнейм</label>
          <input type="text" id="app_nick" placeholder="Наприклад: Alex_Foma">
        </div>
        <div class="input-group">
          <label>День народження</label>
          <input type="text" id="app_bday" placeholder="ДД.ММ">
        </div>
        <div class="input-group">
          <label>Останні 6 цифр картки</label>
          <input type="text" id="app_card" placeholder="123456">
        </div>
        <div class="input-group">
          <label>Ігровий ID</label>
          <input type="text" id="app_id" placeholder="172258">
        </div>
        <div class="input-group">
          <label>Discord User/ID</label>
          <input type="text" id="app_discord" placeholder="username#0000">
        </div>
        <div class="input-group">
          <label>Ваш вік</label>
          <input type="number" id="app_age" placeholder="18">
        </div>
        <div class="input-group">
          <label>Онлайн у грі</label>
          <input type="text" id="app_time" placeholder="3-4 години">
        </div>
        <div class="input-group">
          <label>Знання РП (1-10)</label>
          <input type="number" id="app_rp" placeholder="10">
        </div>
        <div class="input-group">
          <label>Прокачка M4A4 (%)</label>
          <input type="text" id="app_m4" placeholder="100%">
        </div>
        <div class="input-group">
          <label>Хто запросив</label>
          <input type="text" id="app_inviter" placeholder="Нікнейм">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-accent" onclick="submitApplication()">Надіслати заявку</button>
      </div>
    </div>

    <!-- Вкладка 2: Особистий кабінет -->
    <div id="cabinet" class="tab">
      <div class="section-title">🔑 Авторизація сокланівця</div>
      <div class="form-grid">
        <div class="input-group full">
          <label>Номер картки (6 цифр)</label>
          <input type="text" id="user_card" placeholder="Введіть 6 цифр вашої картки">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-accent" onclick="loginUser()">Увійти в кабінет</button>
      </div>

      <div id="cabinet_info" class="stats-container" style="display:none;">
        <div class="stat-card">
          <span class="label">Нікнейм</span>
          <span class="value" id="res_nick">-</span>
        </div>
        <div class="stat-card">
          <span class="label">Ранг</span>
          <span class="value" id="res_rank">-</span>
        </div>
        <div class="stat-card">
          <span class="label">Баланс</span>
          <span class="value" id="res_balance" style="color:var(--green);">-</span>
        </div>
        <div class="stat-card">
          <span class="label">Штрафи / Догани</span>
          <span class="value" id="res_reprimands" style="color:var(--red);">-</span>
        </div>
      </div>
    </div>

    <!-- Вкладка 3: Керівництво -->
    <div id="admin" class="tab">
      <div id="admin_login_box">
        <div class="section-title">💼 Вхід для Керівництва</div>
        <div class="form-grid">
          <div class="input-group full">
            <label>PIN-код Модератора</label>
            <input type="password" id="admin_pin" placeholder="•••••••">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-accent" onclick="adminLogin()">Авторизуватись</button>
        </div>
      </div>

      <div id="admin_panel" style="display:none;">
        <div class="section-title">💼 Панель Керівника: <span id="admin_name_disp" style="color:var(--accent); margin-left:8px;"></span></div>
        
        <p style="color:var(--text-dim); margin-bottom:12px; font-weight:600;">📦 ПРИЙОМ ПРОДУКЦІЇ</p>
        <div class="form-grid grid-3">
          <div class="input-group full-3">
            <label>Тип продукції</label>
            <select id="prod_type"><option>Петрушка</option><option>Алкоголь</option></select>
          </div>
          <div class="input-group full-3">
            <label>ID сокланівця</label>
            <input type="text" id="prod_member_id" placeholder="172258">
          </div>
          <div class="input-group"><label>1⭐ Кількість</label><input type="number" id="qty1" placeholder="0"></div>
          <div class="input-group"><label>2⭐ Кількість</label><input type="number" id="qty2" placeholder="0"></div>
          <div class="input-group"><label>3⭐ Кількість</label><input type="number" id="qty3" placeholder="0"></div>
        </div>
        <div class="btn-row">
          <button class="btn btn-green" onclick="sendProduct()">Прийняти товар</button>
        </div>

        <div style="border-top:1px solid var(--border); margin: 28px 0;"></div>

        <p style="color:var(--text-dim); margin-bottom:12px; font-weight:600;">🔫 ВИДАЧА ЗБРОЇ СКАЛАДУ</p>
        <div class="form-grid">
          <div class="input-group">
            <label>Нікнейм сокланівця</label>
            <input type="text" id="w_nick" placeholder="Alex_Foma">
          </div>
          <div class="input-group">
            <label>Ранг</label>
            <select id="w_rank">
              <option>Молодший</option><option>Місцевий</option>
              <option>Старший</option><option>Модератор</option><option>Лідер</option>
            </select>
          </div>
          <div class="input-group">
            <label>Кількість M4 (0 = за нормою)</label>
            <input type="number" id="w_m4" placeholder="0">
          </div>
          <div class="input-group">
            <label>Кількість Броні (0 = за нормою)</label>
            <input type="number" id="w_armor" placeholder="0">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-red" onclick="giveWeapon()">Видати зі списанням</button>
        </div>
      </div>
    </div>

  </main>

<script>
  const API_URL = "YOUR_WEB_APP_URL"; 
  let currentAdmin = "";

  function switchTab(tabId, e) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    e.target.classList.add('active');
  }

  async function apiCall(data) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
    return await res.json();
  }

  async function submitApplication() {
    const payload = {
      action: "submit_application",
      nick: document.getElementById('app_nick').value,
      bday: document.getElementById('app_bday').value,
      card: document.getElementById('app_card').value,
      memberId: document.getElementById('app_id').value,
      discord: document.getElementById('app_discord').value,
      age: document.getElementById('app_age').value,
      playTime: document.getElementById('app_time').value,
      rpScore: document.getElementById('app_rp').value,
      m4Skill: document.getElementById('app_m4').value,
      inviter: document.getElementById('app_inviter').value,
    };
    const res = await apiCall(payload);
    alert(res.message);
  }

  async function loginUser() {
    const card = document.getElementById('user_card').value;
    const res = await apiCall({ action: "get_member_cabinet", card: card });
    if(res.success) {
      document.getElementById('cabinet_info').style.display = "grid";
      document.getElementById('res_nick').innerText = res.data.nick;
      document.getElementById('res_rank').innerText = res.data.rank;
      document.getElementById('res_balance').innerText = res.data.balance + " грн.";
      document.getElementById('res_reprimands').innerText = res.data.reprimands;
    } else {
      alert(res.message);
    }
  }

  async function adminLogin() {
    const pin = document.getElementById('admin_pin').value;
    const res = await apiCall({ action: "admin_login", pin: pin });
    if(res.success) {
      currentAdmin = res.adminName;
      document.getElementById('admin_login_box').style.display = "none";
      document.getElementById('admin_panel').style.display = "block";
      document.getElementById('admin_name_disp').innerText = currentAdmin;
    } else {
      alert(res.message);
    }
  }

  async function sendProduct() {
    const res = await apiCall({
      action: "receive_product",
      adminName: currentAdmin,
      product: document.getElementById('prod_type').value,
      memberId: document.getElementById('prod_member_id').value,
      qty1: document.getElementById('qty1').value,
      qty2: document.getElementById('qty2').value,
      qty3: document.getElementById('qty3').value
    });
    alert(res.message);
  }

  async function giveWeapon() {
    const res = await apiCall({
      action: "give_weapon",
      adminName: currentAdmin,
      memberNick: document.getElementById('w_nick').value,
      rank: document.getElementById('w_rank').value,
      m4: document.getElementById('w_m4').value,
      armor: document.getElementById('w_armor').value
    });
    alert(res.message);
  }
</script>

</body>
</html>
