<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKAY Clan — Official Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-card: rgba(18, 24, 38, 0.75);
      --bg-card-hover: rgba(26, 35, 56, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(59, 130, 246, 0.4);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(147, 51, 234, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* Top Navigation Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 14, 20, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #2563eb, #9333ea);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #ffffff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Container Structure */
    .container {
      width: 100%;
      max-width: 480px;
      margin: 24px auto 0;
      padding: 0 16px;
    }

    /* Glass Cards */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card-header {
      margin-bottom: 20px;
      text-align: center;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Form Fields */
    .input-group {
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 21, 33, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), #1d4ed8);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Cabinet Info Layout */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-top: 4px;
    }

    /* Modal / Alert Notification */
    .alert-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .alert-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .alert-box {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.25s ease;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .alert-overlay.active .alert-box {
      transform: scale(1);
    }

    .alert-text {
      font-size: 0.95rem;
      margin-bottom: 20px;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Loader */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">S</div>
      <div class="brand-title">SKAY PORTAL</div>
    </div>
  </header>

  <main class="container">
    
    <!-- Секція Авторизації -->
    <div id="authCard" class="card">
      <div class="card-header">
        <h2 class="card-title">Авторизація</h2>
        <p class="card-subtitle">Введіть останні 6 цифр вашої картки</p>
      </div>

      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="input-group">
          <label class="input-label">Номер картки</label>
          <input type="text" id="cardInput" class="input-field" placeholder="172258" required pattern="[0-9]+" maxlength="12" autocomplete="off">
        </div>
        <button type="submit" id="authBtn" class="btn">
          <span>Увійти в кабінет</span>
        </button>
      </form>
    </div>

    <!-- Особистий кабінет (Прихований за замовчуванням) -->
    <div id="cabinetCard" class="card hidden">
      <div class="card-header">
        <h2 class="card-title" id="userNick">User_Nick</h2>
        <p class="card-subtitle" id="userRank">Ранг</p>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Баланс</div>
          <div class="stat-value" id="userBalance">0 грн</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Догана / Попередження</div>
          <div class="stat-value" id="userReprimands">0/3</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Бонуси</div>
          <div class="stat-value" id="userBonus">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">День народження</div>
          <div class="stat-value" id="userBday">-</div>
        </div>
      </div>

      <button onclick="logout()" class="btn" style="background: rgba(255,255,255,0.05); margin-top: 20px; border: 1px solid var(--border-color);">
        Вийти
      </button>
    </div>

  </main>

  <!-- Кастомне модальне вікно для помилок / сповіщень -->
  <div id="alertOverlay" class="alert-overlay">
    <div class="alert-box">
      <p id="alertText" class="alert-text"></p>
      <button onclick="closeAlert()" class="btn">OK</button>
    </div>
  </div>

  <script>
    // Вкажіть ваше актуальне посилання на Google Apps Script Web App
    const API_URL = "https://script.google.com/macros/s/AKfycbxWE8RXp0eREpijhOjnjrMtdO3m-GdR2VtOz54zzUVVsiYpqegl3HvteK1ICN5RrJBO/exec";

    function showAlert(text) {
      document.getElementById('alertText').innerText = text;
      document.getElementById('alertOverlay').classList.add('active');
    }

    function closeAlert() {
      document.getElementById('alertOverlay').classList.remove('active');
    }

    async function apiCall(data) {
      try {
        const formData = new URLSearchParams();
        for (const key in data) {
          formData.append(key, data[key]);
        }

        const response = await fetch(API_URL, {
          method: 'POST',
          body: formData
        });

        return await response.json();
      } catch (e) {
        console.error("API Error:", e);
        return { success: false, message: "Помилка з'єднання з сервером." };
      }
    }

    async function handleAuth(event) {
      event.preventDefault();
      const card = document.getElementById('cardInput').value.trim();
      const btn = document.getElementById('authBtn');

      if (!card) return;

      btn.disabled = true;
      btn.innerHTML = `<div class="spinner"></div> Перевірка...`;

      const res = await apiCall({ action: "get_member_cabinet", card: card });

      btn.disabled = false;
      btn.innerHTML = `<span>Увійти в кабінет</span>`;

      if (res.success && res.data) {
        document.getElementById('authCard').classList.add('hidden');
        
        document.getElementById('userNick').innerText = res.data.nick || "Учасник";
        document.getElementById('userRank').innerText = res.data.rank || "Учасник";
        document.getElementById('userBalance').innerText = (res.data.balance || 0) + " грн";
        document.getElementById('userReprimands').innerText = (res.data.reprimands || "0") + " / " + (res.data.warnings || "0");
        document.getElementById('userBonus').innerText = res.data.bonus || "0";
        document.getElementById('userBday').innerText = res.data.bday || "-";

        document.getElementById('cabinetCard').classList.remove('hidden');
      } else {
        showAlert(res.message || "Помилка авторизації");
      }
    }

    function logout() {
      document.getElementById('cabinetCard').classList.add('hidden');
      document.getElementById('authCard').classList.remove('hidden');
      document.getElementById('cardInput').value = '';
    }
  </script>
</body>
</html>
