<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKAY Clan — Портал</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(13, 17, 26, 0.85);
      --card-border: rgba(45, 60, 95, 0.4);
      --primary-blue: #2563eb;
      --primary-glow: #1d4ed8;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(29, 78, 216, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Форумний Навбар (Ukraine GTA style) */
    .forum-nav {
      background: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 16px;
    }

    .nav-item {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
    }

    /* Основний контент */
    .main-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 32px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 25px rgba(37, 99, 235, 0.08);
    }

    .card-head {
      text-align: center;
      margin-bottom: 24px;
    }

    .card-head h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .card-head p {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(7, 10, 16, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.3);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Кабінет */
    .cabinet-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px 14px;
      border-radius: 10px;
    }

    .info-title {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .info-val {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-top: 4px;
    }

    /* Модалка повідомлень */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0d111a;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px;
      width: 90%;
      max-width: 350px;
      text-align: center;
    }

    .modal-card p {
      margin-bottom: 18px;
      font-size: 0.95rem;
    }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .nav-links { display: none; }
      .auth-card { padding: 24px 18px; }
    }
  </style>
</head>
<body>

  <nav class="forum-nav">
    <div class="brand-group">
      <div class="logo-badge">S</div>
      <span class="brand-name">SKAY Clan</span>
    </div>
    <div class="nav-links">
      <a href="#" class="nav-item active">Головна</a>
      <a href="#" class="nav-item">Портал</a>
      <a href="#" class="nav-item">Форум</a>
    </div>
  </nav>

  <div class="main-wrapper">
    
    <!-- Авторизація -->
    <div id="authBlock" class="auth-card">
      <div class="card-head">
        <h2>Авторизація</h2>
        <p>Введіть останні 6 цифр вашої картки</p>
      </div>

      <form onsubmit="doLogin(event)">
        <div class="form-group">
          <label class="form-label">Номер картки</label>
          <input type="text" id="userCard" class="form-input" placeholder="172258" required pattern="[0-9]+" maxlength="12">
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">Увійти в кабінет</button>
      </form>
    </div>

    <!-- Кабінет -->
    <div id="cabinetBlock" class="auth-card hidden">
      <div class="card-head">
        <h2 id="dispNick">---</h2>
        <p id="dispRank">---</p>
      </div>

      <div class="cabinet-grid">
        <div class="info-box">
          <div class="info-title">Баланс</div>
          <div class="info-val" id="dispBalance">0 грн</div>
        </div>
        <div class="info-box">
          <div class="info-title">Догани / Попередження</div>
          <div class="info-val" id="dispRep">0 / 0</div>
        </div>
        <div class="info-box">
          <div class="info-title">Бонуси</div>
          <div class="info-val" id="dispBonus">0</div>
        </div>
        <div class="info-box">
          <div class="info-title">День народження</div>
          <div class="info-val" id="dispBday">-</div>
        </div>
      </div>

      <button onclick="exitCabinet()" class="btn-submit" style="margin-top: 20px; background: rgba(255,255,255,0.08);">Вийти</button>
    </div>

  </div>

  <div id="customModal" class="modal-backdrop">
    <div class="modal-card">
      <p id="modalMsg"></p>
      <button onclick="closeModal()" class="btn-submit">Зрозуміло</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxWE8RXp0eREpijhOjnjrMtdO3m-GdR2VtOz54zzUVVsiYpqegl3HvteK1ICN5RrJBO/exec";

    function showPopup(msg) {
      document.getElementById('modalMsg').innerText = msg;
      document.getElementById('customModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('show');
    }

    async function doLogin(e) {
      e.preventDefault();
      const card = document.getElementById('userCard').value.trim();
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.innerText = "Перевірка...";

      try {
        const params = new URLSearchParams();
        params.append("action", "get_member_cabinet");
        params.append("card", card);

        const res = await fetch(API_URL, { method: "POST", body: params }).then(r => r.json());

        btn.disabled = false;
        btn.innerText = "Увійти в кабінет";

        if (res.success && res.data) {
          document.getElementById('authBlock').classList.add('hidden');
          
          document.getElementById('dispNick').innerText = res.data.nick || "Учасник";
          document.getElementById('dispRank').innerText = res.data.rank || "Клановець";
          document.getElementById('dispBalance').innerText = (res.data.balance || 0) + " грн";
          document.getElementById('dispRep').innerText = (res.data.reprimands || "0") + " / " + (res.data.warnings || "0");
          document.getElementById('dispBonus').innerText = res.data.bonus || "0";
          document.getElementById('dispBday').innerText = res.data.bday || "-";

          document.getElementById('cabinetBlock').classList.remove('hidden');
        } else {
          showPopup(res.message || "Помилка авторизації!");
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = "Увійти в кабінет";
        showPopup("Помилка з'єднання з сервером.");
      }
    }

    function exitCabinet() {
      document.getElementById('cabinetBlock').classList.add('hidden');
      document.getElementById('authBlock').classList.remove('hidden');
    }
  </script>
</body>
</html>
