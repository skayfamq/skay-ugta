<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>SKAY Clan Portal</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
    .nav { display: flex; gap: 10px; margin-bottom: 20px; }
    .nav button { flex: 1; padding: 10px; background: #333; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
    .nav button.active { background: #0088cc; }
    .tab { display: none; }
    .tab.active { display: block; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
    button.submit-btn { background: #28a745; font-weight: bold; cursor: pointer; border: none; }
    .card-box { background: #2a2a2a; padding: 15px; border-radius: 6px; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>SKAY CLAN PORTAL</h2>
  
  <div class="nav">
    <button class="active" onclick="switchTab('apply')">📝 Подати заявку</button>
    <button onclick="switchTab('cabinet')">🔑 Кабінет</button>
    <button onclick="switchTab('admin')">💼 Керівництво</button>
  </div>

  <!-- Вкладка 1: Анкета -->
  <div id="apply" class="tab active">
    <h3>Подати заявку на вступ</h3>
    <input type="text" id="app_nick" placeholder="Ігровий Нікнейм">
    <input type="text" id="app_bday" placeholder="День народження (ДД.ММ)">
    <input type="text" id="app_card" placeholder="Останні 6 цифр картки">
    <input type="text" id="app_id" placeholder="Ігровий ID">
    <input type="text" id="app_discord" placeholder="Discord User/ID">
    <input type="number" id="app_age" placeholder="Ваш вік">
    <input type="text" id="app_time" placeholder="Онлайн у грі (наприклад: 3-4 год)">
    <input type="number" id="app_rp" placeholder="Знання РП (від 1 до 10)">
    <input type="text" id="app_m4" placeholder="Прокачка M4A4 (%)">
    <input type="text" id="app_inviter" placeholder="Хто запросив">
    <button class="submit-btn" onclick="submitApplication()">Надіслати заявку</button>
  </div>

  <!-- Вкладка 2: Особистий Кабінет -->
  <div id="cabinet" class="tab">
    <h3>Авторизація сокланівця</h3>
    <input type="text" id="user_card" placeholder="Введіть 6 цифр вашої картки">
    <button class="submit-btn" onclick="loginUser()">Увійти в кабінет</button>
    
    <div id="cabinet_info" class="card-box" style="display:none;"></div>
  </div>

  <!-- Вкладка 3: Панель Керівництва -->
  <div id="admin" class="tab">
    <div id="admin_login_box">
      <h3>Вхід для Модераторів</h3>
      <input type="password" id="admin_pin" placeholder="Введіть 7-значний PIN">
      <button class="submit-btn" onclick="adminLogin()">Увійти</button>
    </div>

    <div id="admin_panel" style="display:none;">
      <h3>Вітаємо, <span id="admin_name_disp"></span>!</h3>
      
      <h4>📦 Прийом продукції</h4>
      <select id="prod_type"><option>Петрушка</option><option>Алкоголь</option></select>
      <input type="text" id="prod_member_id" placeholder="ID сокланівця">
      <input type="number" id="qty1" placeholder="1⭐ Кількість">
      <input type="number" id="qty2" placeholder="2⭐ Кількість">
      <input type="number" id="qty3" placeholder="3⭐ Кількість">
      <button class="submit-btn" onclick="sendProduct()">Прийняти товар</button>

      <hr style="border-color:#444; margin:20px 0;">

      <h4>🔫 Видача зброї сокланівцю</h4>
      <input type="text" id="w_nick" placeholder="Нікнейм сокланівця">
      <select id="w_rank">
        <option>Молодший</option><option>Місцевий</option>
        <option>Старший</option><option>Модератор</option><option>Лідер</option>
      </select>
      <input type="number" id="w_m4" placeholder="Кількість M4 (або 0 за нормою)">
      <input type="number" id="w_armor" placeholder="Кількість Броні (або 0 за нормою)">
      <button class="submit-btn" style="background:#dc3545;" onclick="giveWeapon()">Видати зі списанням зі складу</button>
    </div>
  </div>
</div>

<script>
  // ЗАМІНІТЬ ЦЕ ПОСИЛАННЯ НА ВАШ URL З GOOGLE APPS SCRIPT
  const API_URL = "https://script.google.com/macros/s/AKfycbwLy-MSdOMQnNV2g8jSd65yhdFYc05nFJa4RboxHp4ipn023LQBgkTdvS8eLDakIdhU/exec"; 
  let currentAdmin = "";

  function switchTab(tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }

  async function apiCall(data) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
    return await res.json();
  }

  async function submitApplication() {
    const payload = {
      action: "submit_application",
      nick: document.getElementById('app_nick').value,
      bday: document.getElementById('app_bday').value,
      card: document.getElementById('app_card').value,
      memberId: document.getElementById('app_id').value,
      discord: document.getElementById('app_discord').value,
      age: document.getElementById('app_age').value,
      playTime: document.getElementById('app_time').value,
      rpScore: document.getElementById('app_rp').value,
      m4Skill: document.getElementById('app_m4').value,
      inviter: document.getElementById('app_inviter').value,
    };
    const res = await apiCall(payload);
    alert(res.message);
  }

  async function loginUser() {
    const card = document.getElementById('user_card').value;
    const res = await apiCall({ action: "get_member_cabinet", card: card });
    if(res.success) {
      const box = document.getElementById('cabinet_info');
      box.style.display = "block";
      box.innerHTML = `<b>Нік:</b> ${res.data.nick}<br><b>Ранг:</b> ${res.data.rank}<br><b>Баланс:</b> ${res.data.balance} грн.<br><b>Штрафи/Догани:</b> ${res.data.reprimands}`;
    } else {
      alert(res.message);
    }
  }

  async function adminLogin() {
    const pin = document.getElementById('admin_pin').value;
    const res = await apiCall({ action: "admin_login", pin: pin });
    if(res.success) {
      currentAdmin = res.adminName;
      document.getElementById('admin_login_box').style.display = "none";
      document.getElementById('admin_panel').style.display = "block";
      document.getElementById('admin_name_disp').innerText = currentAdmin;
    } else {
      alert(res.message);
    }
  }

  async function sendProduct() {
    const res = await apiCall({
      action: "receive_product",
      adminName: currentAdmin,
      product: document.getElementById('prod_type').value,
      memberId: document.getElementById('prod_member_id').value,
      qty1: document.getElementById('qty1').value,
      qty2: document.getElementById('qty2').value,
      qty3: document.getElementById('qty3').value
    });
    alert(res.message);
  }

  async function giveWeapon() {
    const res = await apiCall({
      action: "give_weapon",
      adminName: currentAdmin,
      memberNick: document.getElementById('w_nick').value,
      rank: document.getElementById('w_rank').value,
      m4: document.getElementById('w_m4').value,
      armor: document.getElementById('w_armor').value
    });
    alert(res.message);
  }
</script>

</body>
</html>
